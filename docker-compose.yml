services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5.12
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/foodcoach123
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p foodcoach123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  ml_service:
    build: ./ml_service
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=foodcoach123
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - VOICE_TTS_URL=http://voice_tts:8100
      - WHISPER_MODEL=small
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  voice_tts:
    profiles: ["voice"]
    build: ./voice_tts
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - tts_model_cache:/root/.cache/huggingface

  backend_gateway:
    build: ./backend_gateway
    ports:
      - "5001:5001"
      - "5000:5001"
    environment:
      - PORT=5001
      - NODE_ENV=${NODE_ENV:-development}
      - MONGO_URI=mongodb://mongodb:27017/foodcoach_ai
      - ML_SERVICE_URL=http://ml_service:8000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-foodcoach-local-access-secret-change-before-deploy}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-foodcoach-local-refresh-secret-change-before-deploy}
    depends_on:
      mongodb:
        condition: service_healthy
      ml_service:
        condition: service_started

  frontend_client:
    build: ./frontend_client
    ports:
      - "5173:5173"
    depends_on:
      - backend_gateway

volumes:
  mongo_data:
  ollama_data:
  tts_model_cache:
